name: Update KZZ ICS

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate ICS
        run: python main.py

      - name: Validate ICS
        run: |
          grep -q "BEGIN:VCALENDAR" kzz.ics
          grep -q "END:VCALENDAR" kzz.ics

      - name: Show diff
        run: git diff -- kzz.ics

      - name: Commit ICS if changed
        run: |
          if git diff --quiet -- kzz.ics; then
            echo "No ICS changes."
            exit 0
          fi
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add kzz.ics
          git commit -m "Update convertible bond calendar"
          git push
